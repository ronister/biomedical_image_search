[project]
name = "biomedical-imaging-machine-vision"
version = "0.1.0"
description = ""
authors = [
    {name = "Roni Shternberg",email = "roni.shternberg@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "chromadb>=0.4.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart==0.0.12",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "matplotlib",
    "seaborn",
    "plotly",
    "scikit-learn",
    "tqdm",
    "Pillow>=10.0.0",
    "python-dotenv",
    "open-clip-torch (>=2.31.0,<3.0.0)",
    "pydicom>=2.4.0",
    "pyyaml>=6.0.1",
    "code2flow (>=2.5.1,<3.0.0)",
    "graphviz (>=0.20.3,<0.21.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
